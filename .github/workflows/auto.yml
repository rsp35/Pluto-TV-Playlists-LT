name: Auto Pluto Update

on:
  schedule:
    # Pluto session tokens last ~24h, so every 4h leaves plenty of margin
    # if GitHub delays or drops a run. Minute 23 avoids the top-of-the-hour
    # rush when scheduled runs are most likely to be delayed or skipped.
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-pluto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # GitHub switches off scheduled workflows in a public repo after 60
      # days without human activity, and the bot's own commits don't count.
      # Re-enabling the workflow on every run resets that timer, so the
      # schedule keeps itself alive.
      - name: Keep scheduled runs alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable auto.yml --repo "${{ github.repository }}" || echo "Could not refresh keepalive"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run uuid rotator
        run: node rotate-uuid.js

      - name: Run scraper
        run: node index.js

      - name: Run split channels
        run: node split-channels.js

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update playlist" || echo "No changes"
          git push --force
